name: Build Debug APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Nightly name keeps the base version; the code must grow so the in-app updater can compare builds.
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          VERSION_CODE=$((2458 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks
    
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint with Gradle
        run: ./gradlew lintStbetaRelease

      - name: Upload Lint Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Build with Gradle
        run: |
          # Without a signing key the release APK stays unsigned, so build the installable debug one.
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew clean assembleStbetaRelease
          else
            echo "No signing key found: building a debug APK"
            ./gradlew clean assembleStbetaDebug
          fi

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            ./smarttubetv/build/outputs/apk/stbeta/*/*.apk
          request_rate: 4

      - name: VirusTotal Summary
        if: steps.vt.outcome == 'success'
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | VirusTotal Status | Detailed Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          for apk in ./smarttubetv/build/outputs/apk/stbeta/*/*.apk; do
            filename=$(basename "$apk")
            sha256=$(sha256sum "$apk" | awk '{print $1}')

            # Construct the dynamic badge URL using the hash
            badge_url="https://badges.cssnr.com/vt/id/$sha256?start=green&end=red&n=8"
            vt_link="https://www.virustotal.com/gui/file/$sha256"

            echo "| $filename | [![$filename]($badge_url)]($vt_link) | [View Report]($vt_link) |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stbeta/*/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stbeta/*/*_armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_universal
          path: ./smarttubetv/build/outputs/apk/stbeta/*/*_universal.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_x86
          path: ./smarttubetv/build/outputs/apk/stbeta/*/*_x86.apk
          if-no-files-found: error

      - name: Generate update manifest
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.get_version.outputs.VERSION_CODE }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          name = os.environ["VERSION_NAME"]
          base = "https://github.com/dakai/SmartHackerTube/releases/download/latest/"
          package = {f"downloadUrlList_{abi}": [f"{base}SmartTube_beta_{name}_{abi}.apk"]
                     for abi in ("arm64-v8a", "armeabi-v7a", "x86")}
          package["downloadUrl"] = f"{base}SmartTube_beta_{name}_universal.apk"
          subject = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          manifest = {"package": package,
                      name: {"versionCode": int(os.environ["VERSION_CODE"]), "changelog": [subject]}}
          with open("update.json", "w") as out:
              json.dump(manifest, out, indent=2)
          PY
          cat update.json

      - name: Publish latest release
        if: ${{ env.HAS_SIGNING_KEY == 'true' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest beta build" \
            --notes "Nightly build ${{ steps.get_version.outputs.VERSION_NAME }}" \
            update.json \
            ./smarttubetv/build/outputs/apk/stbeta/release/*.apk
