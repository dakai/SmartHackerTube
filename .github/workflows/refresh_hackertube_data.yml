name: Refresh HackerTube data

on:
  schedule:
    # 03:17 UTC daily. HackerTube rebuilds its export when new HN threads are labeled.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the bundled catalog
        run: python3 tools/hackertube/build_assets.py

      - name: Commit when the catalog changed
        id: commit
        run: |
          if git diff --quiet -- common/src/main/assets/hackertube/videos.jsonl; then
            echo "Catalog is up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/src/main/assets/hackertube/videos.jsonl
          git commit -m "chore(HackerTube): refresh video catalog"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # Pushes with GITHUB_TOKEN do not trigger other workflows, so start the APK build here.
      - name: Start the APK build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI.yml --ref "${GITHUB_REF_NAME}"
